<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DB DPS Launcher</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main>
  <h1>The game didn’t load</h1>
  <p>The launcher couldn’t reach the Dungeon Blitz R website. Check your internet connection, then try again. If the site is down, try again in a few minutes.</p>
  <p class="muted">Address: <span class="path" id="url"></span><br>Error: <span id="error"></span></p>
  <div class="row">
    <button class="primary" id="retry" type="button">Try again</button>
    <button id="logs" type="button">Open the log folder</button>
  </div>
</main>
<script src="offline.js"></script>
</body>
</html>
